<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ordra · LangGraph 实验</title>
  <link rel="stylesheet" href="/static/graph.css?v=1">
  <script src="/static/approval-card.js?v=19.0" defer></script>
  <script src="/static/graph.js?v=1" defer></script>
</head>
<body>
  <header class="page-header"><div><p class="eyebrow">Ordra 实验室</p><h1>LangGraph 对照流程</h1></div><a class="quiet-button" href="/">返回 Ordra 对话</a></header>
  <main class="layout">
    <aside class="panel experiments" aria-label="实验记录">
      <div class="panel-heading"><h2>实验记录</h2><button id="refresh" class="quiet-button" type="button">刷新</button></div>
      <p class="muted">关闭网页后仍可回来查看进度。</p>
      <ul id="experiment-list"></ul>
    </aside>
    <div class="main-column">
      <section class="panel">
        <h2>开始一次实验</h2>
        <p class="muted">每次实验处理一个问题，支持订单查询、知识检索和退货预览。退货预览需人工批准，实验中不会提交申请。</p>
        <form id="experiment-form">
          <label for="question">你想让 Agent 完成什么？</label>
          <textarea id="question" rows="3" maxlength="2000" required placeholder="例如：查询 O1003 的状态和退货政策，并生成退货预览。原因是耳机左侧没有声音。"></textarea>
          <div class="form-bottom"><span id="model-label" class="muted">正在连接…</span><button id="start" type="submit" disabled>运行新实验 ↗</button></div>
        </form>
        <div class="examples"><button type="button" data-question="查询 O1001 订单当前状态和物流。">查询订单</button><button type="button" data-question="检索知识库，说明质量问题的退货政策并注明来源。">检索政策</button><button type="button" data-question="查询 O1003 的状态和退货政策，并生成退货预览。原因是耳机左侧没有声音。">体验人工审批</button></div>
      </section>
      <p id="error" role="alert" hidden></p>
      <section id="empty" class="panel empty"><h2>把执行过程展开来看</h2><p class="muted">选择一条记录，或输入问题运行新实验。</p><p class="flow-guide">模型决策 → 工具 / 人工审批 → 模型整理 → 结果校验</p><p class="muted">工具结果会回到模型；校验未通过时，最多再修正两轮。</p></section>
      <section id="run" class="panel" hidden aria-label="实验详情">
        <div class="panel-heading"><h2 id="run-status"></h2><span id="run-id" class="muted"></span></div>
        <p id="run-question"></p>
        <dl id="metrics" class="metrics"></dl>
        <p id="progress" class="muted" role="status" aria-live="polite"></p>
        <div id="recovery" hidden><p id="run-error"></p><button id="resume" type="button">从保存的节点继续</button></div>
        <div id="approvals"></div>
        <h3>实际执行节点</h3>
        <ol id="events" class="events"></ol>
        <div id="result" hidden><h3>最终答复</h3><p id="answer" class="answer"></p><div id="previews"></div><div id="sources"></div></div>
      </section>
    </div>
  </main>
</body>
</html>
